; Experimental Bluetooth PhoneAPI client; base board settings remain unchanged.
[env:lilygo-t-embed-cc1101-meshtastic]
extends = env:lilygo-t-embed-cc1101
build_flags =
    ${env:lilygo-t-embed-cc1101.build_flags}
    -DBRUCE_MESHTASTIC_BLE=1

[env:lilygo-t-embed-meshtastic]
extends = env:lilygo-t-embed
build_flags =
    ${env:lilygo-t-embed.build_flags}
    -DBRUCE_MESHTASTIC_BLE=1
